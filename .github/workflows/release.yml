name: release

on:
  push:
    tags: ['v*', 'advance-*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          To publish a release, the tag to create from this branch, e.g. advance-0.4.0.
          Leave empty for a test build that publishes nothing.
        required: false
        default: ''

permissions:
  contents: read

env:
  # The release's tag: the pushed tag, or the one typed when running the workflow by hand.
  TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      # slot.advance tags (advance-0.4.0) ship as slot.advance-<version>-rg-sp.zip. The
      # downloads before 0.4.0, the 0.4.0 betas included, were slot-advance-...; they keep
      # their names. Upstream tags keep their own names.
      - name: Name the build
        id: name
        run: |
          set -eu
          case "$TAG" in
            advance-*) out="slot.advance-${TAG#advance-}-rg-sp"; zip="$out.zip" ;;
            *) out="slot-${TAG}"; zip="$out-h700.zip" ;;
          esac
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        run: task dist:device OUT="${{ steps.name.outputs.out }}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="${{ steps.name.outputs.out }}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          file "$out/System/syncthing" | grep -q aarch64
          test -x "$out/System/syncthing"
          sh scripts/syncthing.sh check "$out/System/syncthing"
          test -f "$out/System/licenses/syncthing-LICENSE.txt"
          test -f "$out/System/licenses/syncthing.txt"
          test -f "$out/System/licenses/eff-wordlist-CC-BY-3.0.txt"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="${{ steps.name.outputs.out }}"
          zip="${{ steps.name.outputs.zip }}"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: documentation/releases

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          title="$TAG"
          case "$TAG" in
            advance-*) title="slot.advance ${TAG#advance-}" ;;
          esac
          if [ -f "documentation/releases/$TAG.md" ]; then
            cp "documentation/releases/$TAG.md" notes.md
          else
            cat > notes.md <<NOTES
          Unzip and copy the contents of \`${ZIP%.zip}/\` onto SD2.

          Emulation by mGBA (MPL-2.0) and gpSP (GPL-2.0). Their licences, patches and gpSP's source are in \`System/licenses/\`.
          NOTES
          fi
          # slot.advance tags, betas included (advance-0.4.0-beta.3), are published as ordinary
          # releases, so a recommended beta can be marked Latest. A stable slot.advance tag
          # (no suffix, such as advance-0.4.0) is always marked Latest. Other tags with a
          # pre-release suffix are published as pre-releases and never become Latest.
          # Run by hand with a release_tag, the tag is created here, on the commit just built.
          set -- --title "$title" --notes-file notes.md --target "$GITHUB_SHA"
          case "$TAG" in
            advance-*-*) ;;
            advance-*) set -- "$@" --latest ;;
            *-*) set -- "$@" --prerelease --latest=false ;;
          esac
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" "$@"