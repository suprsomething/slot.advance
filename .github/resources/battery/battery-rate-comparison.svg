<svg xmlns="http://www.w3.org/2000/svg" width="720" height="718" viewBox="0 0 720 718" role="img" aria-labelledby="t d">
<title id="t">Battery used per hour asleep, as observed: about 7% for 0.3.0 (semi-stock) software standby, about 2 to 3.2% for 0.4.x hardware sleep, and 2.0% an hour for each of two 0.5.0 sleeps, Wi-Fi Off and Wi-Fi On</title>
<desc id="d">Dot plot, one point per run, from battery-gauge readings, with whiskers for the rates consistent with whole-percent readings. 0.3.0 (semi-stock), software standby: a modified build held in standby for 2 hours (Test B), 61% to 47%, 7.0% an hour (6.5 to 7.5); ordinary 0.3.0 shuts down 3 minutes after the lid closes. 0.4.x, hardware sleep with Wi-Fi Off, three separate extended sleeps: 0.4.0-beta.3, 98% to 82% in 8 hours, 2.0% an hour (1.9 to 2.1); 0.4.0, 94% to 74% in 7 hours 46 minutes, 2.6% an hour (2.4 to 2.7); 0.4.1-beta.1, 99% to 75% in 7 hours 37 minutes, 3.2% an hour (3.0 to 3.3). Observed range about 2 to 3.2% an hour. 0.5.0 test build 1, one 8-hour sleep each: Wi-Fi Off (V1-B), 77% to 61%, 2.0% an hour (1.9 to 2.1); Wi-Fi On (V1-D), 80% to 64%, 2.0% an hour (1.9 to 2.1). Separate sleeps, not one discharge and not a controlled comparison between releases; the same 0.5.0 reading does not show identical standby current with Wi-Fi Off and On in every situation.</desc>
