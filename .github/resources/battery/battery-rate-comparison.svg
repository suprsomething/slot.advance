<text x="425.0627076857112" y="297" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="start">2.6%</text>
<text x="48" y="333" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="start">0.4.1-beta.1, 7 h 37 min</text>
<path d="M431.0 328H444.1M431.0 322V334M444.1 322V334" stroke="#C2BFD0" stroke-width="2" fill="none"/>
<circle cx="437.5" cy="328" r="5" fill="#8B7CF6" stroke="#EEECF4" stroke-width="1.5"/>
<text x="454.1137855579869" y="333" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="start">3.2%</text>
<text x="32" y="424" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">Whiskers: the rates consistent with whole-percent start and end readings. Ordinary</text>
<text x="32" y="448" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">0.3.0 shuts down 3 minutes after the lid closes; its point is a modified build held</text>
<text x="32" y="472" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">in standby for 2 hours. The 0.4.x points are separate sleeps on different versions,</text>
<text x="32" y="496" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">started at different charge levels: not one discharge, and not a controlled</text>
<text x="32" y="520" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">comparison between 0.4.0 and 0.4.1.</text>
