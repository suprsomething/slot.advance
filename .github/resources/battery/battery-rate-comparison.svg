<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
<title id="t">Battery used per hour asleep, as observed: about 7% for 0.3.0 (semi-stock) software standby, about 2 to 3.2% for 0.4.x hardware sleep</title>
<desc id="d">Dot plot, one point per run, from battery-gauge readings, with whiskers for the rates consistent with whole-percent readings. 0.3.0 (semi-stock), software standby: a modified build held in standby for 2 hours (Test B), 61% to 47%, 7.0% an hour (6.5 to 7.5); ordinary 0.3.0 shuts down 3 minutes after the lid closes. 0.4.x, hardware sleep, three separate extended sleeps: 0.4.0-beta.3, 98% to 82% in 8 hours, 2.0% an hour (1.9 to 2.1); 0.4.0, 94% to 74% in 7 hours 46 minutes, 2.6% an hour (2.4 to 2.7); 0.4.1-beta.1, 99% to 75% in 7 hours 37 minutes, 3.2% an hour (3.0 to 3.3). Observed range about 2 to 3.2% an hour. Not one discharge, and not a controlled comparison between 0.4.0 and 0.4.1.</desc>
<rect x="0.5" y="0.5" width="719" height="559" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Battery used per hour asleep, as observed</text>
<text x="32" y="80" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="start">One point per run, read from the battery gauge</text>
<text x="280.0" y="360" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">0%</text>
<text x="380.0" y="360" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">2%</text>
<text x="480.0" y="360" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">4%</text>
<text x="580.0" y="360" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">6%</text>
<text x="680.0" y="360" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">8%</text>
<line x1="280" y1="338" x2="680" y2="338" stroke="#2E2C38" stroke-width="1"/>
<text x="480.0" y="384" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle">Battery used per hour</text>
<text x="32" y="136" font-size="18" fill="#EEECF4" font-weight="600">0.3.0 (semi-stock)<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">software standby</tspan></text>
<line x1="280.0" y1="148" x2="280.0" y2="184" stroke="#2E2C38" stroke-width="1"/>
<line x1="380.0" y1="148" x2="380.0" y2="184" stroke="#2E2C38" stroke-width="1"/>
<line x1="480.0" y1="148" x2="480.0" y2="184" stroke="#2E2C38" stroke-width="1"/>
<line x1="580.0" y1="148" x2="580.0" y2="184" stroke="#2E2C38" stroke-width="1"/>
<line x1="680.0" y1="148" x2="680.0" y2="184" stroke="#2E2C38" stroke-width="1"/>
<text x="48" y="171" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="start">Modified build, 2 h (Test B)</text>
<path d="M604.9 166H654.8M604.9 160V172M654.8 160V172" stroke="#C2BFD0" stroke-width="2" fill="none"/>
<circle cx="629.9" cy="166" r="5" fill="#5C596C" stroke="#EEECF4" stroke-width="1.5"/>
<text x="594.8646397334444" y="171" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">~7.0% an hour</text>
<text x="32" y="226" font-size="18" fill="#EEECF4" font-weight="600">0.4.x<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">hardware sleep, Wi-Fi Off</tspan></text>
<rect x="380.0" y="238" width="60.0" height="108" rx="4" fill="#8B7CF6" opacity="0.16"/>
<text x="688" y="226" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="end">observed range ~2 to 3.2% an hour</text>
<line x1="280.0" y1="238" x2="280.0" y2="346" stroke="#2E2C38" stroke-width="1"/>
