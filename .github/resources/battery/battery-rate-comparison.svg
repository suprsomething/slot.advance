<text x="480.0" y="526" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle">Battery used per hour</text>
<text x="32" y="566" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">Whiskers: the rates consistent with whole-percent start and end readings. Ordinary</text>
<text x="32" y="590" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">0.3.0 shuts down 3 minutes after the lid closes; its point is a modified build held</text>
<text x="32" y="614" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">in standby for 2 hours. Every point is a separate sleep, on a different version or</text>
<text x="32" y="638" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">night and at a different charge level: not one discharge, and not a controlled</text>
