<svg xmlns="http://www.w3.org/2000/svg" width="720" height="556" viewBox="0 0 720 556" role="img" aria-labelledby="t d">
<title id="t">Estimated current while playing: about 445 mA with Wi-Fi Off, 474 mA with Wi-Fi On, 501 mA with Wi-Fi and Syncthing, about 13% more in all</title>
<desc id="d">Three horizontal bars from the Phase 0B development tests, estimated from battery-gauge readings over the same stretch of battery, 78% to 53%, one run each, playing Pokemon Emerald's intro loop with the lid open: Wi-Fi Off, about 445 mA; Wi-Fi On and connected with Syncthing off, about 474 mA (+29); Wi-Fi On with Syncthing syncing Saves and States, about 501 mA (+56, about 13% more). Projected play from a full battery: about 7.9, 7.4 and 7.0 hours. Not electrical measurements, and not guaranteed battery life. While asleep, 0.5.0 disconnects and takes Wi-Fi down before suspending.</desc>
<rect x="0.5" y="0.5" width="719" height="555" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Battery while playing, with and without Wi-Fi</text>
<text x="32" y="80" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="start">Estimated current from battery-gauge readings, Phase 0B development tests</text>
<line x1="32.0" y1="104" x2="32.0" y2="388" stroke="#2E2C38" stroke-width="1"/>
<text x="32.0" y="412" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="start">0 mA</text>
<line x1="208.0" y1="104" x2="208.0" y2="388" stroke="#2E2C38" stroke-width="1"/>
<text x="208.0" y="412" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">200 mA</text>
<line x1="384.0" y1="104" x2="384.0" y2="388" stroke="#2E2C38" stroke-width="1"/>
<text x="384.0" y="412" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">400 mA</text>
<line x1="560.0" y1="104" x2="560.0" y2="388" stroke="#2E2C38" stroke-width="1"/>
<text x="560.0" y="412" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">600 mA</text>
<text x="32" y="132" font-size="18" fill="#EEECF4" font-weight="600">Wi-Fi Off<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">the default</tspan></text>
<rect x="32" y="146" width="391.6" height="30" rx="4" fill="#5C596C"/>
<text x="435.6" y="167" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~445 mA</text>
<text x="32" y="224" font-size="18" fill="#EEECF4" font-weight="600">Wi-Fi On<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">connected, Syncthing off</tspan></text>
<rect x="32" y="238" width="417.0" height="30" rx="4" fill="#7A7690"/>
<text x="461.032" y="259" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~474 mA</text>
<text x="688" y="259" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="end">+29 mA (6%)</text>
<text x="32" y="316" font-size="18" fill="#EEECF4" font-weight="600">Wi-Fi On + Syncthing<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">syncing Saves and States</tspan></text>
<rect x="32" y="330" width="440.9" height="30" rx="4" fill="#8B7CF6"/>
<text x="484.88" y="351" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~501 mA</text>
<text x="688" y="351" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="end">+56 mA (13%)</text>
<text x="32" y="452" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">Pokemon Emerald in its intro loop, lid open, same settings, one run each, compared</text>
<text x="32" y="476" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">over the same stretch of battery (78% to 53%). Estimates, not electrical</text>
<text x="32" y="500" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">measurements; projected full-battery play: about 7.9 h, 7.4 h and 7.0 h. Real play,</text>
<text x="32" y="524" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">networks and batteries differ. Asleep, 0.5.0 takes Wi-Fi down first.</text>
</g>
</svg>
